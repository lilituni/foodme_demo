plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'am.foodme'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'com.auth0:java-jwt:3.18.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'org.apache.commons:commons-text:1.9'

    // Observability: Prometheus scrape endpoint, JSON logs for Loki, Sentry/GlitchTip
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    // Push JSON logs to Loki when LOKI_PUSH_URL is set (no-op otherwise)
    implementation 'com.github.loki4j:loki-logback-appender:1.5.2'
    // Enables the logback <if> conditional used to gate the Loki appender
    implementation 'org.codehaus.janino:janino:3.1.12'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.14.0'
    implementation 'io.sentry:sentry-logback:7.14.0'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// Mutation testing (PIT). Run: gradle pitest [-PpitTargetClasses=a.B,c.D]
// CI (.github/workflows/mutation-testing.yml) passes only the classes a PR
// changed and enforces the 80% mutation-score gate from the XML report.
pitest {
    pitestVersion = '1.16.1'
    junit5PluginVersion = '1.2.1'
    targetClasses = (project.findProperty('pitTargetClasses') ?: 'am.foodme.backend.service.*').toString().split(',').toList()
    // Integration tests (MockMvc) exercise the services, so run the whole suite
    // against every mutated class, not only same-named test classes.
    targetTests = ['am.foodme.backend.*']
    // Seeded course bugs (FM-BUG-*) fail on purpose; PIT needs a green suite.
    excludedGroups = ['known-bug']
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    threads = 2
    timeoutConstInMillis = 10000
}
