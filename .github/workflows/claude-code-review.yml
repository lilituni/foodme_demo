# Homework step 2 - Claude code review of every pull request.
#
# Uses Claude Code's own review command, /code-review, from Anthropic's
# official "code-review" plugin (anthropics/claude-code marketplace) instead
# of a hand-written review prompt. The command reviews the PR diff, checks it
# against CLAUDE.md (which pulls in .agents/rules/*.md), filters out
# low-confidence findings, and with --comment posts its findings on the PR as
# inline comments.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN repo secret (created by /install-github-app).
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # the command posts its review comments
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run /code-review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for the gh pr commands the review runs
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"'
