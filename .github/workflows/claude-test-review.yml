# Homework step 4 - Claude review of the TESTS in a pull request.
#
# The review logic lives in the repo skill .agents/skills/test-review
# (ISTQB-based: test conditions & traceability, EP/BVA/decision tables/state
# transitions, test levels, test-case quality, severities). This workflow
# only invokes that skill, so local `/test-review` and CI review the same way.
#
# Output: inline comments on problematic test lines + one sticky report
# comment (from the skill's templates/report.md), updated on every push.
# Static review only - the CI workflow is what actually runs the tests.
# Auth: CLAUDE_CODE_OAUTH_TOKEN repo secret (created by /install-github-app).
name: Claude Test Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-test-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-test-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # sticky comment step only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base + head commits for git diff

      # A PR could commit its own claude-output.md; never post that as our report.
      - name: Remove any checked-in output file
        run: rm -f claude-output.md

      - name: Run Claude test review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Skill,Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Use the `test-review` skill (Skill tool) to review the tests of pull
            request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Base commit: ${{ github.event.pull_request.base.sha }}
            Head commit: ${{ github.event.pull_request.head.sha }}
            Get the change with:
              git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Follow the skill completely: leave inline comments on test lines that
            need changing, and write the report (skill template) to the file
            claude-output.md in the current directory. Do not post the report
            yourself.

      - name: Fallback if Claude produced no output
        if: success() || failure()
        run: |
          if [ ! -s claude-output.md ]; then
            printf '## 🧪 Claude test review\n\n⚠️ The review did not produce output. See the [workflow run](%s).\n' \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > claude-output.md
          fi

      - name: Post / update test review comment
        if: success() || failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: claude-test-review
          path: claude-output.md
