name: CI

# PRs: build + lint only - the tests a PR needs are chosen and run by selective-tests.yml.
# main: the FULL suite runs after every merge, and `selection-check` compares it with the
# merged PR's selection (did the selector skip a test that fails?).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/backend

      - name: Build with Gradle
        working-directory: apps/backend
        # On a PR the selected JUnit classes run in selective-tests.yml.
        run: ./gradlew build ${{ github.event_name == 'pull_request' && '-x test' || '' }}

      # No JUnit run on a PR (-x test), so nothing to upload or publish there.
      - name: Upload JUnit results
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-results
          path: apps/backend/build/test-results/test/*.xml
          if-no-files-found: warn

      - name: Publish test summary
        if: always() && github.event_name == 'push'
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: apps/backend/build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false

  web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build

  admin:
    name: Admin Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Lint
        working-directory: apps/admin
        run: npm run lint

      - name: Build
        working-directory: apps/admin
        run: npm run build

  e2e:
    name: E2E (Playwright, full suite)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Copy env file
        run: cp .env.example .env

      - name: Boot core profile
        run: docker compose -f infra/docker-compose.yml --profile core up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "backend is up"
              exit 0
            fi
            echo "waiting for backend... ($i)"
            sleep 5
          done
          echo "backend did not become healthy in time"
          docker compose -f infra/docker-compose.yml --profile core logs backend
          exit 1

      - name: Install Playwright deps
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright suite
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json # read by selection-check
        run: npx playwright test --reporter=html,json

      - name: Run admin Playwright suite
        if: success() || failure()
        working-directory: apps/admin
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --reporter=html,json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/admin/playwright-report/
          if-no-files-found: warn

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json
          path: |
            apps/web/playwright-results.json
            apps/admin/playwright-results.json
          if-no-files-found: warn

      - name: Tear down core profile
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile core down -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          # Repo root, like render.yaml and docker-compose: the backend image
          # also builds and bundles the web + admin SPAs.
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: foodme-backend:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: foodme-web:ci

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: apps/admin
          push: false
          tags: foodme-admin:ci

  # Evaluation of Selection Based Testing: the full suite above ran anyway - compare it with what
  # selective-tests.yml chose on the merged PR. A failing test that was NOT selected is a miss.
  selection-check:
    name: Selection check (post-merge)
    if: always() && github.event_name == 'push'
    needs: [backend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find the merged PR's selection
        id: pr
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          [ -z "$pr" ] && { echo "No PR for this push - nothing to evaluate."; exit 0; }
          head=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq .head.sha)
          run=$(gh api "repos/${{ github.repository }}/actions/workflows/selective-tests.yml/runs?head_sha=$head" --jq '.workflow_runs[0].id // empty')
          [ -z "$run" ] && { echo "PR #$pr has no selective-tests run for $head."; exit 0; }
          gh run download "$run" -R "${{ github.repository }}" -n selection -D pr-selection || { echo "No selection artifact in run $run."; exit 0; }
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.pr.outputs.number
        continue-on-error: true
        with:
          name: backend-junit-results
          path: full/junit

      - uses: actions/download-artifact@v4
        if: steps.pr.outputs.number
        continue-on-error: true
        with:
          name: playwright-json
          path: full/pw

      - name: Evaluate
        if: steps.pr.outputs.number
        run: |
          node .agents/skills/select-tests/scripts/evaluate.mjs             --selection pr-selection --out evaluation             --junit-dir full/junit             --web-json full/pw/web/playwright-results.json             --admin-json full/pw/admin/playwright-results.json
          cat evaluation/evaluation.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ steps.pr.outputs.number }}" -R "${{ github.repository }}" --body-file evaluation/evaluation.md

      - uses: actions/upload-artifact@v4
        if: steps.pr.outputs.number
        with:
          name: selection-evaluation
          path: evaluation/
