name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/backend

      - name: Build with Gradle
        working-directory: apps/backend
        run: ./gradlew build

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit-results
          path: apps/backend/build/test-results/test/*.xml
          if-no-files-found: warn

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: apps/backend/build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false

  web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        run: npm run build

  admin:
    name: Admin Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Lint
        working-directory: apps/admin
        run: npm run lint

      - name: Build
        working-directory: apps/admin
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Copy env file
        run: cp .env.example .env

      - name: Boot core profile
        run: docker compose -f infra/docker-compose.yml --profile core up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "backend is up"
              exit 0
            fi
            echo "waiting for backend... ($i)"
            sleep 5
          done
          echo "backend did not become healthy in time"
          docker compose -f infra/docker-compose.yml --profile core logs backend
          exit 1

      - name: Install Playwright deps
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright suite
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: warn

      - name: Tear down core profile
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile core down -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          # Repo root, like render.yaml and docker-compose: the backend image
          # also builds and bundles the web + admin SPAs.
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: foodme-backend:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: foodme-web:ci

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: apps/admin
          push: false
          tags: foodme-admin:ci
